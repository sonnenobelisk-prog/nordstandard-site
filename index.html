<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NordStandard</title>

  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      padding: 40px;
    }

    .label {
      color: #777;
      letter-spacing: 4px;
      margin-bottom: 20px;
      font-size: 12px;
    }

    h1 {
      font-size: 64px;
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    p {
      color: #999;
      font-size: 20px;
      line-height: 1.6;
      max-width: 700px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 16px;
    }

    button {
      padding: 14px 28px;
      background: transparent;
      border: 1px solid #555;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      border-color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="label">NORDSTANDARD</div>

    <h1>
      Nordic Fulfillment Infrastructure
    </h1>

    <p>
      Warehousing, logistics operations and scalable fulfillment standards
      for modern commerce across Europe.
    </p>

    <div class="buttons">
      <button>Contact</button>
      <button>Learn More</button>
    </div>
  </div>
</body>
</html>
